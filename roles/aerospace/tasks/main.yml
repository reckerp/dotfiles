- name: "Aerospace | Config folder"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ ansible_facts.user_dir }}/.config/aerospace"
    state: directory

- name: "Aerospace | Create symlink to role files directory"
  ansible.builtin.file:
    src: "{{ role_path }}/files/aerospace"
    dest: "{{ ansible_facts.user_dir }}/.config/aerospace"
    state: link
    force: true
